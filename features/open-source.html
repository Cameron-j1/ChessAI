    <style>
        .feature-detail-section {
            margin-top: 100px;  /* Add margin to prevent header overlap */
        }
        /* Add dropdown styles */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--white);
            min-width: 200px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            border-radius: 8px;
            z-index: 1;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .dropdown-content a {
            color: var(--text-color);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            transition: background-color 0.3s;
        }
        .dropdown-content a:hover {
            background-color: var(--light-bg);
            color: var(--primary-color);
        }
        .dropdown > a {
            padding-right: 20px;
        }
        .dropdown > a::after {
            content: '▼';
            font-size: 0.8em;
            margin-left: 5px;
        }
    </style>
</head>
